<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .section { font: 700 18px Arial, sans-serif; fill: #111827; }
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #334155; }
      .box { rx: 9; ry: 9; stroke-width: 3; }
      .input { fill: #eaf3ff; stroke: #1d4e89; }
      .compute { fill: #ffffff; stroke: #475569; }
      .state { fill: #fff4d6; stroke: #a16207; }
      .math { fill: #ecfdf3; stroke: #15803d; }
      .result { fill: #f1f5f9; stroke: #334155; }
      .rule { stroke: #cbd5e1; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 9 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="320"/>
  <text class="section" x="36" y="27" text-anchor="start">Token-level persistent-state datapath</text>
  <line class="rule" x1="36" y1="196" x2="964" y2="196"/>
  <text class="section" x="36" y="224" text-anchor="start">Native MXFP4 arithmetic path reused inside compute</text>

  <rect class="box input" x="45" y="57" width="135" height="72"/>
  <text class="label" x="112" y="86" text-anchor="middle">Token inputs</text>
  <text class="tiny" x="112" y="109" text-anchor="middle">q_t, k_t, v_t, beta, gate</text>

  <rect class="box input" x="235" y="57" width="150" height="72"/>
  <text class="label" x="310" y="85" text-anchor="middle">MXFP4 pack</text>
  <text class="tiny" x="310" y="108" text-anchor="middle">E2M1 + E8M0 blocks</text>

  <rect class="box compute" x="445" y="43" width="270" height="100"/>
  <text class="label" x="580" y="70" text-anchor="middle">Stateful GDN compute</text>
  <text class="tiny" x="580" y="95" text-anchor="middle">predict r_t = S k_t</text>
  <text class="tiny" x="580" y="113" text-anchor="middle">update S_t = S - beta_t e_t k_t^T</text>
  <text class="tiny" x="580" y="131" text-anchor="middle">output o_t = S_t q_t, then gate</text>

  <rect class="box result" x="798" y="57" width="150" height="72"/>
  <text class="label" x="873" y="86" text-anchor="middle">Packed output</text>
  <text class="tiny" x="873" y="109" text-anchor="middle">FP16 boundary value</text>

  <rect class="box state" x="485" y="154" width="190" height="42"/>
  <text class="label" x="580" y="171" text-anchor="middle">On-chip state</text>
  <text class="tiny" x="580" y="189" text-anchor="middle">MXFP4 S_t in BRAM/URAM</text>

  <path class="arrow" d="M 185 93 L 228 93"/>
  <path class="arrow" d="M 392 93 L 437 93"/>
  <path class="arrow" d="M 722 93 L 790 93"/>
  <path class="arrow" d="M 552 147 L 552 153"/>
  <path class="arrow" d="M 608 153 L 608 148"/>

  <rect class="box math" x="65" y="250" width="240" height="52"/>
  <text class="label" x="185" y="272" text-anchor="middle">E2M1 LUT multiply</text>
  <text class="tiny" x="185" y="292" text-anchor="middle">sign XOR, exponent add, mantissa multiply</text>

  <rect class="box math" x="385" y="250" width="240" height="52"/>
  <text class="label" x="505" y="272" text-anchor="middle">Block-scale alignment</text>
  <text class="tiny" x="505" y="292" text-anchor="middle">combine E8M0 scales, shift partials</text>

  <rect class="box math" x="705" y="250" width="240" height="52"/>
  <text class="label" x="825" y="272" text-anchor="middle">Fixed-point accumulation</text>
  <text class="tiny" x="825" y="292" text-anchor="middle">Q4.3 partials into INT24</text>

  <path class="arrow" d="M 312 276 L 377 276"/>
  <path class="arrow" d="M 632 276 L 697 276"/>
</svg>
