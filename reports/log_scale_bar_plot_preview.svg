    <rect x="210" y="120.28" width="80" height="399.72" fill="#5875d6" stroke="#111827" stroke-width="2"/>
    <rect x="450" y="256.39" width="80" height="263.61" fill="#6d83d7" stroke="#111827" stroke-width="2"/>
    <rect x="690" y="431.36" width="80" height="88.64" fill="#168047" stroke="#111827" stroke-width="2"/>

    <g font-size="20" font-weight="700">
