<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="48" text-anchor="middle"
        font-family="Times New Roman, Times, serif" font-size="28" font-weight="700"
        fill="#111827">B. Log-scale bar plot</text>

  <g font-family="Times New Roman, Times, serif" fill="#111827">
    <rect x="120" y="80" width="740" height="440" fill="none" stroke="#111827" stroke-width="2"/>

    <g stroke="#e5e7eb" stroke-width="2">
      <line x1="120" y1="520" x2="860" y2="520"/>
      <line x1="120" y1="386.72" x2="860" y2="386.72"/>
      <line x1="120" y1="253.45" x2="860" y2="253.45"/>
      <line x1="120" y1="120.17" x2="860" y2="120.17"/>
    </g>

    <g font-size="21">
