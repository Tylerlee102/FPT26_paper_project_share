[project]
name = "gdn-fpga"
version = "0.1.0"
description = "Native MXFP4 persistent-state dataflow accelerator for Gated DeltaNet decode"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "jinja2>=3",
  "reportlab>=4",
  "pypdf>=5",
]
qwen = [
  "torch",
  "transformers",
  "datasets",
  "accelerate",
  "safetensors",
]
microsoft_mx = [
  "mx @ git+https://github.com/microsoft/microxcaling.git",
]
full = [
  "torch",
  "transformers",
  "datasets",
  "accelerate",
  "safetensors",
  "pytest>=8",
  "hypothesis>=6",
  "jinja2>=3",
  "reportlab>=4",
  "pypdf>=5",
]

[tool.setuptools.packages.find]
include = ["golden*", "reports*", "scripts*"]
exclude = ["data*", "gdn_mxfp4_hls*", "hls*", "paper*", "vivado*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--basetemp=reports/test_tmp/pytest"
cache_dir = "reports/test_tmp/pytest_cache"

[tool.ruff.lint.per-file-ignores]
# These byte-hashed evidence sources retain their registered identities.
"golden/gdn_e2m0_encoded_vectorized.py" = ["F401"]
"reports/benchmark/corrected/write_log_development_source_snapshot/scripts/long_sequence_stability.py" = ["F541"]
"scripts/bf16_vivado_report.py" = ["F541"]
"scripts/example_report.py" = ["F541", "F841"]
"scripts/generate_e2m0_hls_trace.py" = ["F401"]
"scripts/paper_figures.py" = ["F401"]
"scripts/paper_graph_previews.py" = ["F541"]
"scripts/plot_write_log_held_out.py" = ["F841"]
"scripts/qwen_recurrent_capture.py" = ["F401"]
